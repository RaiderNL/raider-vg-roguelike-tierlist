<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="icon"
        type="image/x-icon"
        href="Ico-min.ico"
    >

    <title>Raider_VG Ultimate Roguelike Tierlist</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="site-header">
        <h1>Roguelike Tier List</h1>

        <p>
            Все рогалики, что я обозревал на YouTube
        </p>
    </header>

    <main class="container">

        <section class="controls">
            <label for="search">
                Поиск игры
            </label>

            <input
                type="search"
                id="search"
                placeholder="Введите название игры..."
            >

            <label for="tag-filter">
                Жанр
            </label>

            <select id="tag-filter">
                <option value="">
                    Все жанры
                </option>
            </select>

            <label for="video-filter">
                Видео
            </label>

            <select id="video-filter">
                <option value="">
                    Все ролики
                </option>
            </select>
        </section>

        <div class="tier-list-layout">

            <section class="tier-list">

                <div class="tier-row">
                    <div class="tier-label tier-s">
                        S
                    </div>

                    <div
                        class="games-container"
                        id="tier-S"
                    >
                        <!-- Игры уровня S будут добавлены здесь -->
                    </div>
                </div>

                <div class="tier-row">
                    <div class="tier-label tier-a">
                        A
                    </div>

                    <div
                        class="games-container"
                        id="tier-A"
                    >
                        <!-- Игры уровня A будут добавлены здесь -->
                    </div>
                </div>

                <div class="tier-row">
                    <div class="tier-label tier-b">
                        B
                    </div>

                    <div
                        class="games-container"
                        id="tier-B"
                    >
                        <!-- Игры уровня B будут добавлены здесь -->
                    </div>
                </div>

                <div class="tier-row">
                    <div class="tier-label tier-c">
                        C
                    </div>

                    <div
                        class="games-container"
                        id="tier-C"
                    >
                        <!-- Игры уровня C будут добавлены здесь -->
                    </div>
                </div>

                <div class="tier-row">
                    <div class="tier-label tier-d">
                        D
                    </div>

                    <div
                        class="games-container"
                        id="tier-D"
                    >
                        <!-- Игры уровня D будут добавлены здесь -->
                    </div>
                </div>

                <div class="tier-row">
                    <div class="tier-label tier-e">
                        E
                    </div>

                    <div
                        class="games-container"
                        id="tier-E"
                    >
                        <!-- Игры уровня E будут добавлены здесь -->
                    </div>
                </div>

                <div class="tier-row">
                    <div class="tier-label tier-f">
                        F
                    </div>

                    <div
                        class="games-container"
                        id="tier-F"
                    >
                        <!-- Игры уровня F будут добавлены здесь -->
                    </div>
                </div>

            </section>

            <aside
                class="selected-video-panel"
                id="selected-video-panel"
                aria-hidden="true"
            >
                <!-- Выбранное видео будет добавлено через script.js -->
            </aside>

        </div>

    </main>

    <footer class="site-footer">
        <p>
            Все обзоры доступны на
            <a
                class="channel-link"
                href="https://www.youtube.com/@Raider_VG"
                target="_blank"
                rel="noopener noreferrer"
            >
                моём YouTube-канале
            </a>
        </p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
