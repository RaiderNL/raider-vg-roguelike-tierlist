
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Мой игровой Tier List</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="site-header">
        <h1>Мой игровой Tier List</h1>

        <p>
            Игры, которые я обозревал на YouTube
        </p>
    </header>

    <main class="container">

        <section class="controls">
            <label for="search">
                Поиск игры
            </label>

            <input
                type="search"
                id="search"
                placeholder="Введите название игры..."
            >

            <label for="tag-filter">
                Жанр
            </label>

            <select id="tag-filter">
                <option value="">Все жанры</option>
            </select>
        </section>

        <section class="tier-list">

            <div class="tier-row">
                <div class="tier-label tier-s">
                    S
                </div>

                <div class="games-container" id="tier-S">
                    <!-- Игры уровня S будут добавлены здесь -->
                </div>
            </div>

            <div class="tier-row">
                <div class="tier-label tier-a">
                    A
                </div>

                <div class="games-container" id="tier-A">
                    <!-- Игры уровня A будут добавлены здесь -->
                </div>
            </div>

            <div class="tier-row">
                <div class="tier-label tier-b">
                    B
                </div>

                <div class="games-container" id="tier-B">
                    <!-- Игры уровня B будут добавлены здесь -->
                </div>
            </div>

            <div class="tier-row">
                <div class="tier-label tier-c">
                    C
                </div>

                <div class="games-container" id="tier-C">
                    <!-- Игры уровня C будут добавлены здесь -->
                </div>
            </div>

            <div class="tier-row">
                <div class="tier-label tier-d">
                    D
                </div>

                <div class="games-container" id="tier-D">
                    <!-- Игры уровня D будут добавлены здесь -->
                </div>
            </div>

            <div class="tier-row">
                <div class="tier-label tier-e">
                    E
                </div>

                <div class="games-container" id="tier-E">
                    <!-- Игры уровня E будут добавлены здесь -->
                </div>
            </div>

            <div class="tier-row">
                <div class="tier-label tier-f">
                    F
                </div>

                <div class="games-container" id="tier-F">
                    <!-- Игры уровня F будут добавлены здесь -->
                </div>
            </div>

        </section>

    </main>

    <footer class="site-footer">
        <p>
            Все обзоры доступны на моём YouTube-канале
        </p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
