<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="icon"
        type="image/x-icon"
        href="Ico-min.ico"
    >

    <title>Raider_VG Ultimate Roguelike Tierlist</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="site-header">
        <h1>Tier List Roguelike Games</h1>
    
        <p>
            Мой тир-лист рогаликов
        </p>
    
        </label>
    </header>


    <main class="container">

        <section class="controls">
           <div class="video-filter-controls">
        <div class="control-group filter-group">
            <label for="video-filter">
                Видео
            </label>
    
            <select id="video-filter">
                <option value="">
                    Все ролики
                </option>
            </select>
        </div>
    
        <label class="price-mode-toggle">
            <input
                id="price-mode-toggle"
                type="checkbox"
            >
    
            <span
                class="price-switch"
                aria-hidden="true"
            >
                <span class="price-switch-thumb"></span>
            </span>
    
            <span class="price-mode-label">
                Показывать цены
            </span>
        </label>
    </div>

    
        <div class="control-group filter-group">

            <label for="tag-filter">
                Жанр
            </label>
    
            <select id="tag-filter">
                <option value="">
                    Все жанры
                </option>
            </select>
        </div>
    
        <div class="control-group filter-group">
            <label for="video-filter">
                Видео
            </label>
    
            <select id="video-filter">
                <option value="">
                    Все ролики
                </option>
            </select>
        </div>
    </section>


        <div class="tier-list-layout">

            <section class="tier-list">

                <div class="tier-row">
                    <div class="tier-label tier-s">
                        S
                    </div>

                    <div
                        class="games-container"
                        id="tier-S"
                    >
                        <!-- Игры уровня S будут добавлены здесь -->
                    </div>
                </div>

                <div class="tier-row">
                    <div class="tier-label tier-a">
                        A
                    </div>

                    <div
                        class="games-container"
                        id="tier-A"
                    >
                        <!-- Игры уровня A будут добавлены здесь -->
                    </div>
                </div>

                <div class="tier-row">
                    <div class="tier-label tier-b">
                        B
                    </div>

                    <div
                        class="games-container"
                        id="tier-B"
                    >
                        <!-- Игры уровня B будут добавлены здесь -->
                    </div>
                </div>

                <div class="tier-row">
                    <div class="tier-label tier-c">
                        C
                    </div>

                    <div
                        class="games-container"
                        id="tier-C"
                    >
                        <!-- Игры уровня C будут добавлены здесь -->
                    </div>
                </div>

                <div class="tier-row">
                    <div class="tier-label tier-d">
                        D
                    </div>

                    <div
                        class="games-container"
                        id="tier-D"
                    >
                        <!-- Игры уровня D будут добавлены здесь -->
                    </div>
                </div>

                <div class="tier-row">
                    <div class="tier-label tier-e">
                        E
                    </div>

                    <div
                        class="games-container"
                        id="tier-E"
                    >
                        <!-- Игры уровня E будут добавлены здесь -->
                    </div>
                </div>

                <div class="tier-row">
                    <div class="tier-label tier-f">
                        F
                    </div>

                    <div
                        class="games-container"
                        id="tier-F"
                    >
                        <!-- Игры уровня F будут добавлены здесь -->
                    </div>
                </div>

            </section>

            <aside
                class="selected-video-panel"
                id="selected-video-panel"
                aria-hidden="true"
            >
                <!-- Выбранное видео будет добавлено через script.js -->
            </aside>

        </div>

    </main>

    <footer class="site-footer">
        <p>
            Все обзоры доступны на
            <a
                class="channel-link"
                href="https://www.youtube.com/@Raider_VG"
                target="_blank"
                rel="noopener noreferrer"
            >
                моём YouTube-канале
            </a>
        </p>
    </footer>

    <script
    type="module"
    src="js/main.js"
></script>

</body>
</html>
